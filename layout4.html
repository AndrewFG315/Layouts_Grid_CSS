<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout 4</title>
    <link rel="stylesheet" href="grids.css">
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
</head>
<body>
    <div class="container letra">
        
        <div class="row">
            <div class="col-12 topo"><h1>Topo</h1></div>

            <div class="icon abg">
                <i class="fa-solid fa-user"></i>
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>

        </div>

        <div class="row gap-2">
            <div class="col-3 main">Menu</div>

            <div class="col-9 main">Conteúdo</div>
        </div>

        <div class="row gap-2">
            <div class="col-4 card">Coluna A</div>

            <div class="col-4 card">Coluna B</div>

            <div class="col-4 card">Coluna C</div>
        </div>

        <div class="row rodape">
            <div class="col-10">Rodapé</div>
            
            <div class="col-2 icon">
                <i class="fa-brands fa-youtube"></i>
                <i class="fa-brands fa-square-instagram"></i>
                <i class="fa-brands fa-facebook"></i>
                <i class="fa-brands fa-square-x-twitter"></i>
            </div>
        </div>
    </div>
</body>
</html>
